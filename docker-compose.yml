services:

  gateway:
    build: ./gateway
    ports:
      - '8000:8000'
    environment:
      - OLLAMA_URL=http://ollama:11434
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - ollama
    volumes:
      - ./gateway:/app

  ollama:
    image: ollama/ollama:latest
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data: