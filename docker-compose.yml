services:

  gateway:
    build: ./gateway
    ports:
      - '8000:8000'
    environment:
      - OLLAMA_URL=http://ollama:11434
      - JWT_SECRET=${JWT_SECRET}
      - PRESIDIO_URL=http://presidio:8001
    depends_on:
      - ollama
      - presidio
    volumes:
      - ./gateway:/app
  presidio:
    build: ./presidio
    ports:
      - '8001:8001'

  ollama:
    image: ollama/ollama:latest
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data: